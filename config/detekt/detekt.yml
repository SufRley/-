build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 200
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 20
  CyclomaticComplexMethod:
    threshold: 40
  TooManyFunctions:
    thresholdInFiles: 60
    thresholdInClasses: 60
    # 40 → 45（v1.8.0）：TxnDao 是流水这一张表上所有查询的唯一入口（明细/报表/备份/回收站/
    # 报销/借贷/统计），本就压在 40 上限；资产报表需要「含回收站的响应式全量查询」再加 1 条。
    # 拆接口会让「一张表两个 DAO」在同一事务里交叉引用，代价大于收益，故放宽上限而不是拆。
    thresholdInInterfaces: 45
    thresholdInObjects: 60
  LargeClass:
    threshold: 1200
  NestedBlockDepth:
    threshold: 6

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
  MatchingDeclarationName:
    active: false
  MemberNameEqualsClassName:
    active: false
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9_]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9_]*'

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 8
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UnusedParameter:
    active: false
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  UnnecessaryAbstractClass:
    active: false
  UnusedPrivateClass:
    active: false
  DataClassContainsFunctions:
    active: false
  UseDataClass:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  ThrowsCount:
    max: 6

coroutines:
  GlobalCoroutineUsage:
    active: true

potential-bugs:
  LateinitUsage:
    active: false
  UnsafeCallOnNullableType:
    active: false
  ImplicitUnitReturnType:
    active: false

# 格式类规则交给 ktlint（见 app/build.gradle.kts），detekt 不重复配置：
# detekt-formatting 插件没启用，写 `formatting:` 段会被判为「未知配置项」直接 fail。
